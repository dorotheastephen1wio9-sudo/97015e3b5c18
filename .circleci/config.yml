      - run:
          name: Read output
          command: |
            cat /tmp/zone-a/spriteBundleScarlet
      - run:
          name: Pull latest
          command: git clone -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract archive
          command: tar -xf stage-assets-dev.tar
      - run:
          name: Stabilize
